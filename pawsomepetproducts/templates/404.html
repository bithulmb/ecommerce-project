<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Pawsome Pet Products</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 50px;
        }

        h1 {
            font-family: 'Lobster', cursive;
            font-size: 80px;
            color: #1067da;
        }

        p {
            font-size: 20px;
            color: #555;
        }

        .error-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .error-image {
            margin-top: 30px;
        }

        .error-image img {
            width: 250px;
        }

        .go-home {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 25px;
            background-color: #2b57e7;
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .go-home:hover {
            background-color: #1322e9;
        }

        .paw-print {
            font-size: 100px;
            color: #ff6f61;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>Oops!</h1>
        <p>We can't seem to find the page you're looking for.</p>
        <div class="paw-print">🐾</div>
        <p>But don't worry, we're pawsitive that you'll find what you're looking for on our homepage!</p>
        <a href="{% url 'home_page' %}" class="go-home">Back to Home</a>
        
    </div>

</body>
</html>
